dataset: synthetic
model: simple_cnn_dropout
dropout: 0.3

strategies:
  - random
  - least_confidence
  - margin
  - entropy
  - mc_dropout_entropy
  - bald
  - core_set
  - badge
  - learning_loss

seeds: [1]
train_size: 24
test_size: 8

initial_labeled_size: 8
acquisition_size: 4
num_rounds: 2

epochs: 1
batch_size: 4
learning_rate: 0.01
momentum: 0.9

retrain_from_scratch: true
deterministic: true
num_workers: 0
num_threads: 1
mc_passes: 2
distance_chunk_size: 16

data_dir: data/raw
output_dir: reports/smoke
